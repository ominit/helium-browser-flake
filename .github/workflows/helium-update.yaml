name: Update Helium Browser
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
concurrency:
  group: helium-update
  cancel-in-progress: false
jobs:
  update-helium-browser:
    name: Update Helium Browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Update sources
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/update.sh
      - name: Create update pull request
        id: create-pr
        if: steps.update.outputs.commit_message != ''
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "${{ steps.update.outputs.commit_message }}"
          title: "${{ steps.update.outputs.commit_message }}"
          body: "Automated Helium Browser release update."
          branch: automated/helium-browser-update
          delete-branch: true
          add-paths: sources.json
      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-url != ''
        run: bash .github/enable-auto-merge.sh
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
          GH_TOKEN: ${{ github.token }}
